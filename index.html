<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>錢錢經理人</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FFFFFF;--card:#F8F8F8;--card2:#F0F0F0;--border:#E2E2E2;
  --text:#1A1A1A;--mid:#666660;--dim:#AAAAAA;
  --green:#2D7A4F;--greenLt:#E8F5EE;
  --gold:#B8860B;--goldLt:#FFF8E1;
  --coffee:#7B5E3A;--coffeeLt:#F5EFE6;
  --danger:#D94040;--dangerLt:#FDECEA;
  --blue:#2B5FC2;--blueLt:#EEF3FF;
  --purple:#7B3FA0;--purpleLt:#F3EAFF;
  --radius:14px;--radiusSm:10px;
  --p-color:#2D7A4F;   /* 個人：綠 */
  --j-color:#B8860B;   /* 共同：金 */
}
body{font-family:-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px;font-size:14px;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}

.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.hdr-title{font-size:15px;font-weight:800;color:var(--green);letter-spacing:2px;}
.hdr-sub{font-size:10px;color:var(--dim);margin-top:2px;}
.sync-badge{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;}
.sync-ok{background:var(--greenLt);color:var(--green);}
.sync-ing{background:var(--goldLt);color:var(--gold);}

.page{display:none;padding:12px 14px 0;}
.page.active{display:block;}

.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;}

.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.subtab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--mid);font-size:11px;font-weight:400;white-space:nowrap;transition:all .15s;}
.subtab.active{background:var(--greenLt);color:var(--green);border-color:var(--green);font-weight:700;}

.bar-wrap{background:var(--card2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .8s ease;}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-card{background:var(--card);border-radius:12px;padding:10px 10px;border:1px solid var(--border);text-align:center;}
.stat-label{font-size:9px;color:var(--dim);margin-bottom:3px;}
.stat-val{font-size:13px;font-weight:700;}

.inp{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;width:100%;}
.inp:focus{border-color:var(--green);}
.form-row{display:grid;gap:8px;margin-bottom:8px;}
.form-label{font-size:10px;color:var(--dim);margin-bottom:3px;}
.form-group{display:flex;flex-direction:column;}

.btn-primary{background:var(--green);color:#fff;border-radius:var(--radiusSm);padding:10px;font-weight:700;font-size:13px;width:100%;}
.btn-add{background:var(--green);border-radius:20px;padding:7px 16px;color:#fff;font-size:12px;font-weight:600;}
.add-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.add-bar-label{font-size:12px;font-weight:600;color:var(--mid);}

/* Entry rows with color coding */
.entry{border-radius:11px;padding:10px 14px;margin-bottom:6px;border-left:4px solid transparent;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);}
.entry.personal{border-left:4px solid var(--p-color);}
.entry.joint{border-left:4px solid var(--j-color);}
.entry-desc{font-size:12px;font-weight:600;}
.entry-meta{font-size:10px;color:var(--dim);margin-top:2px;}
.entry-amt{font-size:13px;font-weight:700;}
.entry-p-amt{color:var(--p-color);}
.entry-j-amt{color:var(--j-color);}
.entry-cash-amt{color:var(--dim);}

/* payer badge */
.payer-badge{font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:4px;}
.payer-san{background:#E8F5EE;color:var(--green);}
.payer-ye{background:#FFF8E1;color:var(--gold);}
.payer-pub{background:var(--card2);color:var(--mid);}
.payer-cash{background:var(--card2);color:var(--dim);}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;}
.nav-btn{flex:1;padding:10px 4px 8px;border:none;background:transparent;color:var(--dim);font-size:10px;border-top:2px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;}
.nav-btn.active{color:var(--green);border-top-color:var(--green);}
.nav-icon{font-size:17px;}

.alloc-row{margin-bottom:12px;}
.alloc-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}

.month-section{background:var(--card);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--border);overflow:hidden;}
.month-header{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.month-header:active{background:var(--card2);}
.month-title{font-size:13px;font-weight:700;}
.month-summary{font-size:11px;color:var(--mid);}
.month-chevron{font-size:12px;color:var(--dim);transition:transform .2s;}
.month-chevron.open{transform:rotate(180deg);}
.month-body{display:none;padding:0 14px 12px;}
.month-body.open{display:block;}

.settle-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
.settle-item{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}

.tip{font-size:10px;color:var(--dim);}
.hidden{display:none!important;}
.add-form{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--green);}

/* color legend */
.legend{display:flex;gap:12px;margin-bottom:10px;font-size:10px;color:var(--mid);}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;}

/* invest triangle */
.tri-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.tri-card{border-radius:12px;padding:12px 10px;border:2px solid;text-align:center;}
.tri-code{font-size:13px;font-weight:800;margin-bottom:2px;}
.tri-name{font-size:9px;color:var(--mid);margin-bottom:8px;}
.tri-ratio{font-size:20px;font-weight:900;margin-bottom:4px;}
.tri-inp{background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.1);border-radius:7px;padding:6px 8px;font-size:12px;font-weight:700;width:100%;text-align:center;}

/* report modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:800;margin-bottom:14px;}
.modal-close{float:right;font-size:20px;color:var(--dim);cursor:pointer;line-height:1;}
</style>
</head>

        <input class="inp" type="number" id="sAcc1Value" placeholder="0" inputmode="numeric"/>

        <input class="inp" type="number" id="sAcc2Value" placeholder="0" inputmode="numeric"/>

    </div>
    <div class="form-group" style="margin-bottom:12px">

    <button style="width:100%;margin-top:8px;background:transparent;border:1px solid var(--border);border-radius:var(--radiusSm);padding:10px;font-size:12px;color:var(--mid)" onclick="closeSnapshotModal()">取消</button>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchTab('today',this)"><span class="nav-icon">🏠</span>今日</button>

// ── Storage ──────────────────────────────────────────────────
const useCloud = typeof window.storage !== 'undefined';
async function dbGet(k){
  if(useCloud){try{const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null;}catch{return null;}}
  else{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
}
async function dbSet(k,v){
  if(useCloud){try{await window.storage.set(k,JSON.stringify(v),true);}catch{}}
  else{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
}

// ── Helpers ───────────────────────────────────────────────────
const fmt = n => 'NT$'+Math.round(n).toLocaleString();
const todayStr = () => new Date().toISOString().slice(0,10);
const ymNow = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const ymLabel = ym => {const[y,m]=ym.split('-');return `${y}年${parseInt(m)}月`;};
const monthName = ym => {const[,m]=ym.split('-');return `${parseInt(m)}月`;};
const days=['日','一','二','三','四','五','六'];

function updateHdrDate(){
  const n=new Date();
  document.getElementById('hdrSub').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${days[n.getDay()]} · 小花花 & 小貝貝`;
}

// ── Budget period: resets on 15th ───────────────────────────────
function getPeriodStart(){
  const now=new Date(),today=todayStr();
  const ym=ymNow();
  const this15=`${ym}-15`;
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const prev15=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-15`;
  return today>=this15?this15:prev15;
}
function getSpentInPeriod(){
  const ps=getPeriodStart();
  return personal.filter(e=>e.date>=ps&&!e.cash).reduce((s,e)=>s+e.amt,0);
}
function getJointSpentInPeriod(){
  const ps=getPeriodStart();
  return joint.filter(e=>e.date>=ps).reduce((s,e)=>s+e.amt,0);
}

function getAllMonths(){
  const s=new Set([...personal.map(e=>e.date.slice(0,7)),...joint.map(e=>e.date.slice(0,7))]);
  return [...s].sort().reverse();
}

// ── Period helpers (any date → the 15th it belongs to) ─────────
function getPeriodStartFor(dateStr){
  const [y,m,day]=dateStr.split('-').map(Number);
  if(day>=15)return `${y}-${String(m).padStart(2,'0')}-15`;
  const d=new Date(y,m-2,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-15`;
}
function periodEnd(ps){
  const [y,m]=ps.split('-').map(Number);
  const d=new Date(y,m,14);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function periodLabel(ps){
  const end=periodEnd(ps);
  const[,sm,sd]=ps.split('-');
  const[,em,ed]=end.split('-');
  return `${parseInt(sm)}/${parseInt(sd)}–${parseInt(em)}/${parseInt(ed)}`;
}
function getAllPeriods(){
  const s=new Set([...personal.map(e=>getPeriodStartFor(e.date)),...joint.map(e=>getPeriodStartFor(e.date))]);
  return [...s].sort().reverse();
}

async function saveAll(){
  setBadge(true);
  await Promise.all([dbSet('qqm:p',personal),dbSet('qqm:j',joint),dbSet('qqm:inv',invest)]);
  setBadge(false);

function setBadge(loading){
  const b=document.getElementById('syncBadge');
  b.textContent=loading?'⟳ 同步中':'☁ 已同步';
  b.className='sync-badge '+(loading?'sync-ing':'sync-ok');
}

async function init(){
  setBadge(true);
  // 讀新版 key
  let[p,j,inv]=await Promise.all([dbGet('qqm:p'),dbGet('qqm:j'),dbGet('qqm:inv')]);

  // 如果新版沒資料，嘗試從所有舊版 key 搬移
  if(!p){
    const oldKeys=['lv2:p','lv1:p','fv4:p','qqs3:exp','qqs:expenses'];
    for(const k of oldKeys){
      const old=await dbGet(k);
      if(old&&old.length>0){
        // 統一欄位格式
        p=old.map(e=>({
          id:e.id||Date.now()+Math.random(),
          date:e.date||todayStr(),
          desc:e.desc||e.description||'',
          amt:e.amt||e.amount||0,
          cat:e.cat||e.category||'🙏 其他',
          cash:e.cash||false
        }));
        console.log('個人資料從',k,'搬移',p.length,'筆');
        break;
      }
    }
  }
  if(!j){
    const oldKeys=['lv2:j','lv1:j','fv4:j','qqs3:joint','qqs:joint'];
    for(const k of oldKeys){
      const old=await dbGet(k);
      if(old&&old.length>0){
        // 統一欄位：舊版用 paid 欄位，新版用 payer
        j=old.map(e=>{
          let payer='公費';
          if(e.payer)payer=e.payer;
          else if(e.paid==='三'||e.paid==='三墊')payer='三墊';
          else if(e.paid==='葉'||e.paid==='葉墊')payer='葉墊';
          return {
            id:e.id||Date.now()+Math.random(),
            date:e.date||todayStr(),
            desc:e.desc||e.description||'',
            amt:e.amt||e.amount||0,
            cat:e.cat||e.category||'🙏 其他',
            payer
          };
        });
        console.log('共同資料從',k,'搬移',j.length,'筆');
        break;
      }
    }
  }
  if(!inv){
    const oldKeys=['lv2:inv','lv1:inv','fv4:inv','qqs3:invest'];
    for(const k of oldKeys){
      const old=await dbGet(k);
      if(old){inv=old;break;}
    }
  }

  personal=p||SEED_P;
  joint=j||SEED_J;
  if(inv)invest={...invest,...inv};

  // 搬移完存到新 key
  await Promise.all([dbSet('qqm:p',personal),dbSet('qqm:j',joint),dbSet('qqm:inv',invest)]);

  setBadge(false);
  updateHdrDate();
  setInterval(updateHdrDate,60000);
  renderAll();
}

// ── Period settle: group by 15號 cycle, show who paid ──────────
function getSettleByPeriod(){
  const periods=getAllPeriods();
  return periods.map(ps=>{
    const entries=joint.filter(e=>getPeriodStartFor(e.date)===ps);
    const sanAmt=entries.filter(e=>e.payer==='三墊').reduce((s,e)=>s+e.amt,0);
    const yeAmt=entries.filter(e=>e.payer==='葉墊').reduce((s,e)=>s+e.amt,0);
    const pubAmt=entries.filter(e=>e.payer==='公費').reduce((s,e)=>s+e.amt,0);
    const total=entries.reduce((s,e)=>s+e.amt,0);
    return {ps,entries,sanAmt,yeAmt,pubAmt,total};
  }).filter(x=>x.entries.length>0);
}

  </div>`;

  // Settle mini for current period
  const settleMiniHtml=curSan>0||curYe>0?`<div class="card" style="margin-bottom:10px">
    <div style="font-size:11px;font-weight:700;color:var(--mid);margin-bottom:8px">⚖️ 本期墊付待結（${periodLabel(ps)}）</div>
    ${curSan>0?`<div class="settle-row"><span style="color:var(--mid)">三墊 待公費匯回</span><span style="font-weight:700;color:var(--p-color)">${fmt(curSan)}</span></div>`:''}
    ${curYe>0?`<div class="settle-row" style="border-bottom:none"><span style="color:var(--mid)">葉墊 待公費匯回</span><span style="font-weight:700;color:var(--j-color)">${fmt(curYe)}</span></div>`:''}
  </div>`:'';

  // Add bar
  const addBarHtml=`<div class="add-bar">
    <div class="add-bar-label">${todayTab==='全部'?'今日記錄':todayTab==='個人'?'今日個人':' 今日共同'}</div>
    <button class="btn-add" onclick="openAddForm('${todayTab==='共同'?'共同':'個人'}','addFormTodayContainer')">＋ 新增</button>
  </div>
  <div id="addFormTodayContainer"></div>`;

  // Today entries
  let entriesHtml='';
  if(todayTab==='全部'){
    const all=[...todayP.map(e=>({...e,src:'p'})),...todayJ.map(e=>({...e,src:'j'}))].sort((a,b)=>b.id-a.id);
    entriesHtml=all.length?all.map(e=>entryHTML(e,e.src,true)).join(''):emptyHTML('今日尚無記錄');
  } else if(todayTab==='個人'){
    entriesHtml=todayP.length?[...todayP].sort((a,b)=>b.id-a.id).map(e=>entryHTML(e,'p',true)).join(''):emptyHTML('今日個人尚無記錄');
  } else {
    const jPeriodAll=joint.filter(e=>e.date>=ps).sort((a,b)=>b.date.localeCompare(a.date));
    entriesHtml=`${todayJ.length?[...todayJ].sort((a,b)=>b.id-a.id).map(e=>entryHTML(e,'j',true)).join(''):emptyHTML('今日共同尚無記錄')}
    <div style="font-size:11px;font-weight:600;color:var(--mid);margin:12px 0 6px">本期共同記錄（${periodLabel(ps)}）</div>
    ${jPeriodAll.map(e=>entryHTML(e,'j',true)).join('')||emptyHTML('本期共同尚無其他記錄')}`;
  }

  const heroHtml=todayTab==='共同'?jointHeroHtml:budgetHtml;
  el.innerHTML=subHtml+heroHtml+statsHtml+(todayTab==='共同'?settleMiniHtml:'')+addBarHtml+legendHtml+entriesHtml;
}

function setTodayTab(t){todayTab=t;renderToday();}

// ── RENDER LEDGER ─────────────────────────────────────────────
function renderLedger(){
  const el=document.getElementById('page-ledger');
  const months=getAllMonths();
  const ym=ymNow();
  const monthP=personal.filter(e=>e.date.startsWith(ym)&&!e.cash).reduce((s,e)=>s+e.amt,0);
  const monthJ=joint.filter(e=>e.date.startsWith(ym)).reduce((s,e)=>s+e.amt,0);
  const settleData=getSettleByPeriod();

  const tabs=['流水','圖表','墊付'];
  const subHtml=`<div class="subtabs">${tabs.map(t=>`<button class="subtab${ledgerTab===t?' active':''}" onclick="setLedgerTab('${t}')">${t}</button>`).join('')}</div>`;

  // Legend
  const legendHtml=`<div class="legend">
    <span><span class="legend-dot" style="background:var(--p-color)"></span>個人</span>
    <span><span class="legend-dot" style="background:var(--j-color)"></span>共同</span>
  </div>`;

  // 流水: grouped by month
  let flowHtml='';
  if(months.length===0){flowHtml=emptyHTML('尚無記錄');}
  else{
    months.forEach(m=>{
      const pE=personal.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      const jE=joint.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      const pTotal=pE.filter(e=>!e.cash).reduce((s,e)=>s+e.amt,0);
      const jTotal=jE.reduce((s,e)=>s+e.amt,0);
      const isOpen=m===ym;
      const all=[...pE.map(e=>({...e,src:'p'})),...jE.map(e=>({...e,src:'j'}))].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      const mid=m.replace('-','');
      flowHtml+=`<div class="month-section">
        <div class="month-header" onclick="toggleMonth('m${mid}')">
          <div>
            <div class="month-title">${ymLabel(m)}</div>
            <div class="month-summary" style="display:flex;gap:10px">
              <span style="color:var(--p-color)">個人 ${fmt(pTotal)}</span>
              <span style="color:var(--j-color)">共同 ${fmt(jTotal)}</span>
            </div>
          </div>
          <span class="month-chevron${isOpen?' open':''}" id="chev-m${mid}">▼</span>
        </div>
        <div class="month-body${isOpen?' open':''}" id="m${mid}">
          ${all.map(e=>entryHTML(e,e.src,true)).join('')||emptyHTML('本月尚無記錄')}
        </div>
      </div>`;
    });
  }

  // 圖表
  let chartHtml='';
  months.forEach(m=>{
    const pE=personal.filter(e=>e.date.startsWith(m)&&!e.cash);
    const jE=joint.filter(e=>e.date.startsWith(m));
    const pTotal=pE.reduce((s,e)=>s+e.amt,0);
    const jTotal=jE.reduce((s,e)=>s+e.amt,0);
    const isCur=m===ym;
    // cat breakdown
    const pBycat={},jBycat={};
    CATS.forEach(c=>{
      pBycat[c]=pE.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);
      jBycat[c]=jE.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);
    });
    const pMax=Math.max(...Object.values(pBycat),1);
    const jMax=Math.max(...Object.values(jBycat),1);
    function catBars(bycat,maxV,color){
      return Object.entries(bycat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([cat,val])=>`
        <div style="margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px">
            <span>${cat.replace(/^[^ ]+ /,'')}</span><span style="font-weight:600">${fmt(val)}</span>
          </div>
          ${barHTML(val/maxV*100,color,5)}
        </div>`).join('');
    }
    // over-limit check
    const overP=Object.entries(P_LIMITS).filter(([c,l])=>pBycat[c]>l).sort((a,b)=>(pBycat[b[0]]-b[1])-(pBycat[a[0]]-a[1]));
    const overJ=Object.entries(J_LIMITS).filter(([c,l])=>jBycat[c]>l).sort((a,b)=>(jBycat[b[0]]-b[1])-(jBycat[a[0]]-a[1]));
    const overHtml=(overP.length||overJ.length)?`<div style="background:var(--dangerLt);border-radius:8px;padding:9px 11px;margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;color:var(--danger);margin-bottom:4px">⚠️ 超支</div>
      ${overP.slice(0,2).map(([c,l])=>`<div style="font-size:10px;color:var(--danger)">個人 ${c.replace(/^[^ ]+ /,'')}：超出 ${fmt(pBycat[c]-l)}</div>`).join('')}
      ${overJ.slice(0,2).map(([c,l])=>`<div style="font-size:10px;color:var(--danger)">共同 ${c.replace(/^[^ ]+ /,'')}：超出 ${fmt(jBycat[c]-l)}</div>`).join('')}
    </div>`:'';
    const tipTop=overP[0]?`個人「${overP[0][0].replace(/^[^ ]+ /,'')}」需控制`:pTotal>0?'個人支出良好 ✓':'';
    const tipBot=overJ[0]?`共同「${overJ[0][0].replace(/^[^ ]+ /,'')}」需注意`:jTotal>0?'共同支出良好 ✓':'';
    chartHtml+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700">${ymLabel(m)}</div>
        ${isCur?`<span style="font-size:10px;background:var(--greenLt);color:var(--green);border-radius:20px;padding:2px 8px;font-weight:600">本月</span>`:''}
      </div>
      <div class="g2" style="margin-bottom:10px">
        <div style="background:var(--greenLt);border-radius:10px;padding:10px 12px">
          <div style="font-size:9px;color:var(--mid);margin-bottom:2px">個人</div>
          <div style="font-size:16px;font-weight:800;color:var(--green)">${fmt(pTotal)}</div>
          <div style="font-size:9px;margin-top:2px;color:${pTotal>PERSONAL_BUDGET?'var(--danger)':'var(--dim)'}">${pTotal>PERSONAL_BUDGET?`超出 ${fmt(pTotal-PERSONAL_BUDGET)}`:'預算內'}</div>
        </div>
        <div style="background:var(--goldLt);border-radius:10px;padding:10px 12px">
          <div style="font-size:9px;color:var(--mid);margin-bottom:2px">共同</div>
          <div style="font-size:16px;font-weight:800;color:var(--gold)">${fmt(jTotal)}</div>
          <div style="font-size:9px;color:${jTotal>JOINT_BUDGET?'var(--danger)':'var(--dim)'};margin-top:2px">${jTotal>JOINT_BUDGET?`超出 ${fmt(jTotal-JOINT_BUDGET)}`:`預算內`}</div>
        </div>
      </div>
      ${pTotal>0?`<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:600;color:var(--green);margin-bottom:6px">👤 個人消費</div>${catBars(pBycat,pMax,'var(--green)')}</div>`:''}
      ${jTotal>0?`<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:600;color:var(--gold);margin-bottom:6px">👫 共同消費</div>${catBars(jBycat,jMax,'var(--gold)')}</div>`:''}
      ${overHtml}
      ${tipTop||tipBot?`<div style="background:var(--blueLt);border-radius:8px;padding:9px 11px">
        <div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:3px">💡 建議</div>
        ${tipTop?`<div style="font-size:10px;color:var(--blue)">${tipTop}</div>`:''}
        ${tipBot?`<div style="font-size:10px;color:var(--blue);margin-top:2px">${tipBot}</div>`:''}
      </div>`:''}
    </div>`;
  });

  // 墊付: 按15號週期顯示，三墊/葉墊清單，不計算誰匯誰
  let settleHtml='';
  if(settleData.length===0){settleHtml=emptyHTML('尚無墊付記錄');}
  else{
    const curPs=getPeriodStart();
    settleData.forEach(({ps,entries,sanAmt,yeAmt,pubAmt,total})=>{
      const isCur=ps===curPs;
      const mid2='settle'+ps.replace(/-/g,'');
      const sanItems=entries.filter(e=>e.payer==='三墊');
      const yeItems=entries.filter(e=>e.payer==='葉墊');
      settleHtml+=`<div class="month-section">
        <div class="month-header" onclick="toggleMonth('${mid2}')">
          <div>
            <div class="month-title">${periodLabel(ps)} 墊付${isCur?' (本期)':''}</div>
            <div class="month-summary" style="display:flex;gap:10px">
              ${sanAmt>0?`<span style="color:var(--p-color)">三墊 ${fmt(sanAmt)}</span>`:''}
              ${yeAmt>0?`<span style="color:var(--j-color)">葉墊 ${fmt(yeAmt)}</span>`:''}
              ${pubAmt>0?`<span style="color:var(--mid)">公費 ${fmt(pubAmt)}</span>`:''}
            </div>
          </div>
          <span class="month-chevron${isCur?' open':''}" id="chev-${mid2}">▼</span>
        </div>
        <div class="month-body${isCur?' open':''}" id="${mid2}">
          ${sanAmt>0?`
            <div style="font-size:11px;font-weight:700;color:var(--p-color);margin:8px 0 4px">三墊 → 公費匯回 ${fmt(sanAmt)}</div>
            ${sanItems.map(e=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px">
              <span style="color:var(--mid)">${e.date.slice(5)} ${e.desc}</span>
              <span style="font-weight:600;color:var(--p-color)">-${fmt(e.amt)}</span>
            </div>`).join('')}`:''}
          ${yeAmt>0?`
            <div style="font-size:11px;font-weight:700;color:var(--j-color);margin:8px 0 4px">葉墊 → 公費匯回 ${fmt(yeAmt)}</div>
            ${yeItems.map(e=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px">
              <span style="color:var(--mid)">${e.date.slice(5)} ${e.desc}</span>
              <span style="font-weight:600;color:var(--j-color)">-${fmt(e.amt)}</span>
            </div>`).join('')}`:''}
          ${pubAmt>0?`<div style="font-size:10px;color:var(--dim);margin-top:6px">公費支出 ${fmt(pubAmt)} 已從共同帳戶直接支付</div>`:''}
        </div>
      </div>`;
    });
  }

  // Report button
  const reportBtnHtml=`<div style="margin-bottom:10px">
    <div style="font-size:11px;font-weight:600;color:var(--mid);margin-bottom:6px">產出報表</div>
    <select class="inp" id="reportMonthSel" style="margin-bottom:8px">
      ${months.map(m=>`<option value="${m}">${ymLabel(m)}</option>`).join('')}
    </select>
    <button class="btn-primary" onclick="openReport()">📋 產出本月報表</button>
  </div>`;

  const contentMap={'流水':legendHtml+reportBtnHtml+flowHtml,'圖表':chartHtml,'墊付':settleHtml};
  el.innerHTML=subHtml+`<div>${contentMap[ledgerTab]}</div>`;
}

function setLedgerTab(t){ledgerTab=t;renderLedger();}
function toggleMonth(id){
  const body=document.getElementById(id);
  const chev=document.getElementById('chev-'+id);
  if(body)body.classList.toggle('open');
  if(chev)chev.classList.toggle('open');
}

// ── Report ────────────────────────────────────────────────────
function openReport(){
  const sel=document.getElementById('reportMonthSel');
  const m=sel?sel.value:ymNow();
  const mn=parseInt(m.split('-')[1]);
  const yr=parseInt(m.split('-')[0]);

  const pE=personal.filter(e=>e.date.startsWith(m)&&!e.cash).sort((a,b)=>a.date.localeCompare(b.date));
  const jE=joint.filter(e=>e.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));
  const pTotal=pE.reduce((s,e)=>s+e.amt,0);
  const jTotal=jE.reduce((s,e)=>s+e.amt,0);
  const sanAmt=jE.filter(e=>e.payer==='三墊').reduce((s,e)=>s+e.amt,0);
  const yeAmt=jE.filter(e=>e.payer==='葉墊').reduce((s,e)=>s+e.amt,0);
  const pRem=Math.max(0,8000-pTotal);
  const jRem=Math.max(0,8000-jTotal);

  const pBycat={};CATS.forEach(c=>{const v=pE.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);if(v)pBycat[c]=v;});
  const jBycat={};CATS.forEach(c=>{const v=jE.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);if(v)jBycat[c]=v;});

  const days=['日','一','二','三','四','五','六'];
  const now=new Date();
  const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;

  // 找當月最新快照
  const snap=snapshots.filter(s=>s.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date))[0]
    || snapshots.sort((a,b)=>b.date.localeCompare(a.date))[0]; // fallback 最新一筆

  // 快照文字區塊
  let snapBlock='本月尚未更新投資快照';
  if(snap){
    const pnl=snap.totalValue-snap.totalCost;
    const pct=snap.totalCost>0?(pnl/snap.totalCost*100).toFixed(2):0;
    const sign=pnl>=0?'＋':'－';
    snapBlock=`${snap.date} 股票庫存現值\n總現值　${snap.totalValue.toLocaleString()}\n總成本　${snap.totalCost.toLocaleString()}\n總損益　${sign}${Math.abs(pnl).toLocaleString()} (${pnl>=0?'+':''}${pct}%)\n—————`;
    snap.accounts.forEach(a=>{snapBlock+=`\n${a.name}　$${a.value.toLocaleString()}`;});
    if(snap.note)snapBlock+=`\n${snap.note}`;
  }

  // 分類行
  const catRow=(cat,val,color)=>`<div style="display:flex;justify-content:space-between;padding:5px 12px;font-size:12px">

    <span style="font-weight:600;color:${color}">${fmt(val)}</span>
  </div>`;

  const sep=`<div style="border-top:1px solid var(--border);margin:4px 0"></div>`;
  const divider=`<div style="text-align:center;font-size:11px;color:var(--dim);letter-spacing:2px;padding:6px 0">━━━━━━━━━━━━━━━</div>`;

  // 流水行
  const flowRow=(e,src)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid var(--border)">
    <span><span style="color:var(--dim)">${e.date.slice(5)}</span> ${e.desc}${src==='j'?` <span style="font-size:9px;color:var(--mid)">(${e.payer})</span>`:''}
    </span>
    <span style="font-weight:600;flex-shrink:0;margin-left:6px;color:${src==='j'?'var(--gold)':'var(--green)'}">${fmt(e.amt)}</span>
  </div>`;

  const html=`<div style="font-size:11px">

    <!-- 標題 -->
    <div style="text-align:center;padding:12px 0 8px">
      <div style="font-size:14px;font-weight:900;letter-spacing:1px">╔═══════════════╗</div>
      <div style="font-size:13px;font-weight:900;padding:2px 0">錢錢經理人 ${mn}月財務報表</div>
      <div style="font-size:14px;font-weight:900;letter-spacing:1px">╚═══════════════╝</div>
      <div style="margin-top:6px;font-size:11px;color:var(--mid)">🐢 小花花 & 小貝貝 🐢</div>
      <div style="font-size:10px;color:var(--dim);margin-top:2px">產出時間：${dateStr}</div>
    </div>

    ${divider}
    <div style="font-size:12px;font-weight:700;text-align:center;padding:4px 0;color:var(--text)">📅 ${yr}年${mn}月</div>
    ${divider}

    <!-- 個人支出 -->
    <div style="background:var(--greenLt);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px">
        <span>👤 個人支出</span>
        <span style="color:var(--green)">${fmt(pTotal)} ${pTotal<=8000?'✓ 預算內':''}</span>
      </div>
      ${pTotal<=8000?`<div style="font-size:10px;color:var(--green);margin-bottom:6px">盈餘：${fmt(pRem)}</div>`:''}

        ${Object.entries(pBycat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>catRow(c,v,'var(--green)')).join('')}
      </div>
    </div>

    <!-- 共同支出 -->
    <div style="background:var(--goldLt);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px">
        <span>👫 共同支出</span>
        <span style="color:var(--gold)">${fmt(jTotal)} ${jTotal<=8000?'✓ 預算內':''}</span>
      </div>
      ${jTotal<=8000?`<div style="font-size:10px;color:var(--gold);margin-bottom:6px">盈餘：${fmt(jRem)}</div>`:''}
      <div style="background:var(--card);border-radius:8px;overflow:hidden">
        ${Object.entries(jBycat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>catRow(c,v,'var(--gold)')).join('')}
      </div>
      ${sanAmt>0||yeAmt>0?`<div style="margin-top:8px;font-size:10px;color:var(--mid)">
        ${sanAmt>0?`三墊待匯回 <b style="color:var(--green)">${fmt(sanAmt)}</b>　`:''}
        ${yeAmt>0?`葉墊待匯回 <b style="color:var(--gold)">${fmt(yeAmt)}</b>`:''}
      </div>`:''}

    <div style="font-size:12px;font-weight:700;text-align:center;padding:4px 0">📈 ${mn}月投資概況</div>

      </div>
      <div style="display:none;padding:4px 0">
        ${pE.map(e=>flowRow(e,'p')).join('')||'<div style="color:var(--dim);font-size:11px;padding:6px 0">無記錄</div>'}
      </div>
    </div>

    <!-- 共同流水 可開合 -->
    <div style="margin-bottom:8px">
      <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'"
        style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--goldLt);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600">
        <span>👫 共同流水　${fmt(jTotal)}</span>
        <span style="color:var(--dim);font-size:11px">點開 ▼</span>
      </div>
      <div style="display:none;padding:4px 0">
        ${jE.map(e=>flowRow(e,'j')).join('')||'<div style="color:var(--dim);font-size:11px;padding:6px 0">無記錄</div>'}
      </div>
    </div>

  </div>`;

  // ── 純文字複製版 ──
  const L='━━━━━━━━━━━━━━━━━\n';
  let txt='╔══════════════════════╗\n';
  txt+=`║  錢錢經理人 ${mn}月財務報表  ║\n`;
  txt+='╚══════════════════════╝\n';
  txt+=`🐢 小花花 & 小貝貝 🐢\n產出時間：${dateStr}\n\n`;
  txt+=`${L}📅 ${yr}年${mn}月\n${L}\n`;
  txt+=`👤 個人支出：${fmt(pTotal)}${pTotal<=8000?' ✓ 預算內　盈餘：'+fmt(pRem):''}\n\n【個人明細】\n`;
  Object.entries(pBycat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
    const name=c.replace(/^[^ ]+ /,'');
    txt+=`  ${name.padEnd(6)}${fmt(v)}\n`;
  });
  txt+=`\n${L}📈 ${mn}月投資概況\n${L}\n`;
  txt+=snapBlock+'\n\n';
  txt+=`${L}💦 ${mn}月支出流水\n${L}\n`;
  txt+=`【個人】總計 ${fmt(pTotal)}\n`;
  pE.forEach(e=>{txt+=`${e.date.slice(5)} ${e.desc} -${fmt(e.amt)}\n`;});
  txt+=`\n共同支出：${fmt(jTotal)}${jTotal<=8000?' ✓ 預算內　盈餘：'+fmt(jRem):''}\n\n【共同明細】\n`;
  Object.entries(jBycat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
    const name=c.replace(/^[^ ]+ /,'');
    txt+=`  ${name.padEnd(6)}${fmt(v)}\n`;
  });
  txt+=`\n【共同】總計 ${fmt(jTotal)}\n`;
  jE.forEach(e=>{txt+=`${e.date.slice(5)} ${e.desc}(${e.payer}) -${fmt(e.amt)}\n`;});
  if(sanAmt>0||yeAmt>0){
    txt+=`\n⚖️ 墊付待結清\n`;
    if(sanAmt>0)txt+=`三墊 → 公費匯回 ${fmt(sanAmt)}\n`;
    if(yeAmt>0)txt+=`葉墊 → 公費匯回 ${fmt(yeAmt)}\n`;
  }
  window._reportText=txt;

  document.getElementById('reportContent').innerHTML=html;
  document.getElementById('reportModal').classList.add('open');
}
function closeReport(){document.getElementById('reportModal').classList.remove('open');}
function copyReport(){
  const txt=window._reportText||'';
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('✅ 已複製'));}
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('✅ 已複製');}
}

// ── RENDER INVEST ─────────────────────────────────────────────

  const mv865=parseFloat(invest.mv865)||0;
  const cash=parseFloat(invest.cash)||0;

  // Triangle ratio 5:4:2

  const tri=[
    {code:'00631L',name:'元大台灣50正2',ratio:5,color:'var(--green)',border:'#8BC4A0',bg:'#EAF5EE',key:'mv631',mv:mv631,target:totalInv>0?totalInv*(5/totalRatio):0},
    {code:'00662',name:'富邦NASDAQ',ratio:4,color:'var(--blue)',border:'#90A8E0',bg:'#EEF3FF',key:'mv662',mv:mv662,target:totalInv>0?totalInv*(4/totalRatio):0},
    {code:'00865B',name:'中信投等債',ratio:2,color:'var(--coffee)',border:'#C0A080',bg:'#F5EFE6',key:'mv865',mv:mv865,target:totalInv>0?totalInv*(2/totalRatio):0},

  function invField(key,label){
    return `<div class="form-group"><div class="form-label" style="font-size:10px;color:var(--mid);margin-bottom:3px">${label}</div>

  }

  el.innerHTML=`
    <div class="card">
      <div class="card-title">📐 金三角投資策略</div>
      <div class="tri-grid">
        ${tri.map(t=>`<div class="tri-card" style="background:${t.bg};border-color:${t.border}">
          <div class="tri-code" style="color:${t.color}">${t.code}</div>
          <div class="tri-name">${t.name}</div>
          <div class="tri-ratio" style="color:${t.color}">${t.ratio}</div>
          <div style="font-size:9px;color:var(--mid)">${Math.round(t.ratio/totalRatio*100)}%</div>
        </div>`).join('')}
      </div>
      <div style="font-size:10px;color:var(--mid);text-align:center;margin-top:4px">比例 5 : 4 : 2</div>
    </div>

    <div class="card">
      <div class="card-title">💰 市值填入</div>
      <div class="form-row" style="grid-template-columns:1fr 1fr">
        ${tri.map(t=>invField(t.key,`${t.code} 市值`)).join('')}
        ${invField('cash','💰 銀彈現金')}
      </div>

      <div style="margin-top:10px;padding:12px;background:var(--greenLt);border-radius:10px">
        <div style="font-size:10px;color:var(--mid);margin-bottom:4px">投資總市值</div>
        <div style="font-size:24px;font-weight:900;color:var(--green)">${totalAll>0?fmt(totalAll):'—'}</div>
        ${totalInv>0?`<div class="tip" style="margin-top:4px">投資 ${fmt(totalInv)} ＋ 銀彈 ${fmt(cash)}</div>`:''}
      </div>

    ${totalInv>0?`<div class="card">
      <div class="card-title">⚖️ 目前配置 vs 目標</div>

        const actual=totalInv>0?t.mv/totalInv*100:0;

        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
            <span style="font-weight:600;color:${t.color}">${t.code}</span>
            <span style="color:${diffColor};font-size:10px">${actual.toFixed(1)}% / 目標${target.toFixed(0)}% (${diff>=0?'+':''}${diff.toFixed(1)}%)</span>

          ${barHTML(actual,t.color,7)}

    <div class="card">
      <div class="card-title">🔄 再平衡規則</div>
      ${[
        ['00631L獲利>65%','賣出部分轉旅遊現金','var(--green)'],
        ['00631L虧損<35%','銀彈加碼攤平','var(--gold)'],
        ['旅遊桶報酬>10%','撥50%獲利出來','var(--green)'],
        ['旅遊桶報酬5~10%','撥30%獲利出來','var(--coffee)'],
        ['旅遊桶虧損','不動等回本','var(--danger)'],
        ['任一標的偏離>5%','考慮再平衡','var(--blue)'],

        <span style="color:var(--mid)">${c}</span>
        <span style="font-weight:600;color:${col}">${a}</span>
      </div>`).join('')}

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin-bottom:0">📊 帳戶庫存快照</div>
        <button onclick="openAddSnapshot()" style="background:var(--green);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">＋ 新增</button>

}

function updInv(k,v){invest[k]=parseFloat(v)||0;saveAll();renderInvest();}

// ── Investment snapshots ──────────────────────────────────────
let snapshots=[];

async function loadSnapshots(){
  const s=await dbGet('qqm:snaps');
  if(s)snapshots=s;
  else snapshots=[{
    id:1,
    date:'2026-06-02',
    totalValue:17987,
    totalCost:16298,
    accounts:[
      {name:'玉山活水庫',value:2274},
      {name:'國泰銀彈庫',value:13702},
    ],
    note:'四月五月共同基金日常開銷結餘轉投資 NT$6,000\n⬆️ 調整後\n玉山活水庫 NT$8,274\n國泰銀彈庫 NT$7,702'
  }];
}

async function saveSnapshots(){
  await dbSet('qqm:snaps',snapshots);
}

function renderSnapshots(){
  const el=document.getElementById('snapshotList');
  if(!el)return;
  if(!snapshots.length){el.innerHTML=`<div style="text-align:center;padding:20px 0;color:var(--dim);font-size:12px">尚無快照記錄</div>`;return;}
  el.innerHTML=snapshots.slice().reverse().map((s,i)=>{
    const pnl=s.totalValue-s.totalCost;
    const pnlPct=s.totalCost>0?(pnl/s.totalCost*100).toFixed(2):0;
    const pnlColor=pnl>=0?'var(--green)':'var(--danger)';
    const isFirst=i===0;
    const mid='snap'+s.id;
    return `<div class="month-section" style="margin-bottom:8px">
      <div class="month-header" onclick="toggleMonth('${mid}')">
        <div>
          <div class="month-title">📅 ${s.date} 快照</div>
          <div class="month-summary" style="color:${pnlColor};font-weight:600">${pnl>=0?'+':''}${fmt(pnl)} (${pnl>=0?'+':''}${pnlPct}%)</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:700">${fmt(s.totalValue)}</span>
          <span class="month-chevron${isFirst?' open':''}" id="chev-${mid}">▼</span>
        </div>
      </div>
      <div class="month-body${isFirst?' open':''}" id="${mid}">
        <div style="padding:4px 0 10px">
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="color:var(--mid)">總現值</span>
            <span style="font-weight:700">${fmt(s.totalValue)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="color:var(--mid)">總成本</span>
            <span style="font-weight:700">${fmt(s.totalCost)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="color:var(--mid)">總損益</span>
            <span style="font-weight:700;color:${pnlColor}">${pnl>=0?'+':''}${fmt(pnl)} (${pnl>=0?'+':''}${pnlPct}%)</span>
          </div>
          ${s.accounts.map(a=>`
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="color:var(--mid)">${a.name}</span>
            <span style="font-weight:600">${fmt(a.value)}</span>
          </div>`).join('')}
          ${s.note?`<div style="margin-top:8px;padding:9px 11px;background:var(--goldLt);border-radius:8px;font-size:11px;color:var(--mid);white-space:pre-line;line-height:1.7">📌 ${s.note}</div>`:''}
          <div style="display:flex;gap:6px;margin-top:10px">
            <button onclick="copySnapshot(${s.id})" style="flex:1;background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">複製報表</button>
            <button onclick="deleteSnapshot(${s.id})" style="background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--dim);font-family:inherit;cursor:pointer">刪除</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openAddSnapshot(){
  const modal=document.getElementById('snapshotModal');
  if(modal)modal.classList.add('open');
  // reset form
  const today=todayStr();
  document.getElementById('sDate').value=today;
  document.getElementById('sTotalValue').value='';
  document.getElementById('sTotalCost').value='';
  document.getElementById('sAcc1Name').value='玉山活水庫';
  document.getElementById('sAcc1Value').value='';
  document.getElementById('sAcc2Name').value='國泰銀彈庫';
  document.getElementById('sAcc2Value').value='';
  document.getElementById('sNote').value='';
}

function closeSnapshotModal(){
  const modal=document.getElementById('snapshotModal');
  if(modal)modal.classList.remove('open');
}

function submitSnapshot(){
  const date=document.getElementById('sDate').value;
  const totalValue=parseFloat(document.getElementById('sTotalValue').value)||0;
  const totalCost=parseFloat(document.getElementById('sTotalCost').value)||0;
  const acc1Name=document.getElementById('sAcc1Name').value||'玉山活水庫';
  const acc1Value=parseFloat(document.getElementById('sAcc1Value').value)||0;
  const acc2Name=document.getElementById('sAcc2Name').value||'國泰銀彈庫';
  const acc2Value=parseFloat(document.getElementById('sAcc2Value').value)||0;
  const note=document.getElementById('sNote').value.trim();
  if(!totalValue){alert('請填入總現值');return;}
  snapshots.push({
    id:Date.now(),date,totalValue,totalCost,
    accounts:[{name:acc1Name,value:acc1Value},{name:acc2Name,value:acc2Value}],
    note
  });
  saveSnapshots();
  closeSnapshotModal();
  renderSnapshots();
}

function deleteSnapshot(id){
  if(!confirm('確認刪除此快照？'))return;
  snapshots=snapshots.filter(s=>s.id!==id);
  saveSnapshots();renderSnapshots();
}

function copySnapshot(id){
  const s=snapshots.find(x=>x.id===id);
  if(!s)return;
  const pnl=s.totalValue-s.totalCost;
  const pnlPct=s.totalCost>0?(pnl/s.totalCost*100).toFixed(2):0;
  const sign=pnl>=0?'+':'';
  let txt=`📅 ${s.date} 股票庫存現值\n`;
  txt+=`─────────────────\n`;
  txt+=`總現值　　${fmt(s.totalValue)}\n`;
  txt+=`總成本　　${fmt(s.totalCost)}\n`;
  txt+=`總損益　　${sign}${fmt(pnl)} (${sign}${pnlPct}%)\n`;
  txt+=`─────────────────\n`;
  s.accounts.forEach(a=>{txt+=`${a.name}　${fmt(a.value)}\n`;});
  if(s.note){txt+=`─────────────────\n📌 ${s.note}\n`;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('✅ 已複製'));
  } else {
    const ta=document.createElement('textarea');ta.value=txt;
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    alert('✅ 已複製');
  }
}

// ── Run ───────────────────────────────────────────────────────
async function initAll(){
  await init();
  await loadSnapshots();
  renderSnapshots();
}
initAll();
</script>
